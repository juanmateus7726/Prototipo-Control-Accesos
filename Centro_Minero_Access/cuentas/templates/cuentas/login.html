{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión - Sistema de Control</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/accesibilidad.css' %}">

  <!-- Iconos (Bootstrap Icons) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
      body {
          background: linear-gradient(120deg, #005DA8, #39A900);
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .login-card {
          background: #fff;
          border-radius: 16px;
          box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
          max-width: 430px;
          width: 100%;
          padding: 2rem 2.5rem;
      }

      .logo-sena {
          width: 90px;
          display: block;
          margin: 0 auto 1rem;
      }

      h2 {
          text-align: center;
          font-weight: 700;
          font-size: 1.8rem;
          color: #005DA8;
          margin-bottom: 1.2rem;
      }

      .form-label {
          font-weight: 500;
          font-size: 0.95rem;
      }

      .input-group-text {
          background: #f4f4f4;
          border-radius: 10px 0 0 10px;
      }

      .form-control {
          border-radius: 0 10px 10px 0;
          transition: border-color 0.3s, box-shadow 0.3s;
      }

      .form-control:focus {
          border-color: #39A900;
          box-shadow: 0 0 8px rgba(57, 169, 0, 0.4);
      }

      .btn-login {
          background: #39A900;
          color: white;
          font-weight: 600;
          border-radius: 10px;
          transition: background 0.3s ease-in-out;
      }

      .btn-login:hover {
          background: #2B8000;
      }

      .form-check-label, .link-pass {
          font-size: 0.9rem;
      }

      .link-pass {
          text-decoration: none;
          color: #005DA8;
      }

      .link-pass:hover {
          text-decoration: underline;
      }

      .register-link {
          text-align: center;
          margin-top: 1rem;
          font-size: 0.9rem;
      }

      .register-link a {
          color: #39A900;
          text-decoration: none;
          font-weight: 600;
      }

      .register-link a:hover {
          text-decoration: underline;
      }

      .footer-text {
          text-align: center;
          font-size: 0.85rem;
          margin-top: 1.2rem;
          color: #555;
      }

      .spinner-border {
          display: none;
          margin-left: 8px;
      }

      /* Modal */
      .modal-header {
          background: #005DA8;
          color: white;
      }

      .btn-register {
          background: #39A900;
          color: white;
          font-weight: 600;
      }

      .btn-register:hover {
          background: #2B8000;
      }
  </style>
</head>

<body>
  <div class="login-card">
      <img src="https://www.sena.edu.co/Style%20Library/alayout/images/logoSena.png" alt="Logo SENA" class="logo-sena">
      <h2>Iniciar Sesión</h2>

      <!-- Mensajes de Django -->
      {% if messages %}
          {% for message in messages %}
              <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                  {{ message }}
                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
              </div>
          {% endfor %}
      {% endif %}

      <form method="POST" id="loginForm">
          {% csrf_token %}
          <!-- Usuario -->
          <div class="mb-3">
              <label for="username" class="form-label">Usuario</label>
              <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="username" name="username" placeholder="Ingrese su usuario" autocomplete="username" required>
              </div>
          </div>

          <!-- Contraseña -->
          <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="password" name="password" placeholder="Ingrese su contraseña" autocomplete="current-password" required>
                  <button type="button" class="btn btn-outline-secondary" id="togglePassword" tabindex="-1">
                      <i class="bi bi-eye-slash"></i>
                  </button>
              </div>
          </div>

          <!-- Recordar usuario y olvidar contraseña -->
          <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label for="rememberMe" class="form-check-label">Recordarme</label>
                </div>
                    <a href="{% url 'cuentas:password_reset' %}" class="btn btn-link text-muted">¿Olvidaste tu contraseña?</a>          </div>

            <!-- Botón -->
            <button type="submit" class="btn btn-login w-100" id="btnLogin">
                Ingresar
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            </button>
        </form>
    </div>

    {% include 'accesibilidad_panel.html' %}

    <script src="{% static 'js/accesibilidad.js' %}?v=2.1"></script>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Spinner
        const form = document.getElementById('loginForm');
        const btnLogin = document.getElementById('btnLogin');
        const spinner = btnLogin.querySelector('.spinner-border');

      form.addEventListener('submit', () => {
          btnLogin.disabled = true;
          spinner.style.display = 'inline-block';
          btnLogin.textContent = "Ingresando...";
      });

      // Mostrar / Ocultar contraseña
      const togglePassword = document.getElementById('togglePassword');
      const passwordField = document.getElementById('password');

      togglePassword.addEventListener('click', () => {
          const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordField.setAttribute('type', type);
          togglePassword.innerHTML = type === 'password'
              ? '<i class="bi bi-eye-slash"></i>'
              : '<i class="bi bi-eye"></i>';
      });
  </script>
</body>
</html>
