{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/control.css' %}?v=1.2">
    <style>
        /* 🔹 Fondo degradado */
        body {
            background: linear-gradient(120deg, #005DA8, #39A900);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 🔹 Tarjeta */
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .login-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        /* 🔹 Logo y título */
        .logo-sena {
            width: 85px;
            display: block;
            margin: 0 auto 1rem;
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #005DA8;
            font-weight: 700;
        }

        /* 🔹 Inputs */
        .form-control {
            border-radius: 10px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-control:focus {
            border-color: #39A900;
            box-shadow: 0 0 8px rgba(57, 169, 0, 0.4);
        }

        /* 🔹 Botón */
        .btn-login {
            background: #39A900;
            color: white;
            font-weight: 600;
            border-radius: 10px;
            transition: background 0.3s, transform 0.2s;
        }
        .btn-login:hover {
            background: #2B8000;
            transform: scale(1.02);
        }

        /* 🔹 Footer */
        .footer-text {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #444;
        }

        /* 🔹 Spinner oculto por defecto */
        .spinner-border {
            display: none;
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="https://www.sena.edu.co/Style%20Library/alayout/images/logoSena.png" alt="Logo SENA" class="logo-sena">
        <h2>Iniciar Sesión</h2>

        <!-- 🔹 Mensajes Django -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <!-- 🔹 Formulario de login -->
        <form method="POST" id="loginForm">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Ingrese su usuario" autocomplete="username" aria-label="Usuario" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Ingrese su contraseña" autocomplete="current-password" aria-label="Contraseña" required>
            </div>
            <button type="submit" class="btn btn-login w-100" id="btnLogin">
                Ingresar
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            </button>
        </form>

        <p class="footer-text mt-3">🔒 Solo personal autorizado</p>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 🔹 Spinner al enviar el formulario
    const form = document.getElementById('loginForm');
    const btnLogin = document.getElementById('btnLogin');
    const spinner = btnLogin.querySelector('.spinner-border');

    form.addEventListener('submit', () => {
        btnLogin.disabled = true;
        spinner.style.display = 'inline-block';
        btnLogin.textContent = "Ingresando ";
    });
</script>
</body>
</html>
