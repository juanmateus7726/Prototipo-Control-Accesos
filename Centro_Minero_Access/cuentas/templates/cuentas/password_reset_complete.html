{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contraseña Actualizada - Sistema SENA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/accesibilidad.css' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<style>
    body {
        background: linear-gradient(120deg, #005DA8, #39A900);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', Tahoma, sans-serif;
    }
    .complete-card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        max-width: 500px;
        width: 100%;
        padding: 3rem 2.5rem;
        text-align: center;
    }
    .success-icon {
        font-size: 4.5rem;
        color: #39A900;
        margin-bottom: 1.5rem;
        animation: scaleIn 0.5s ease-out;
    }
    @keyframes scaleIn {
        from { transform: scale(0); }
        to { transform: scale(1); }
    }
    h2 {
        color: #005DA8;
        font-weight: 700;
        margin-bottom: 1rem;
    }
    .btn-login {
        background: #39A900;
        color: white;
        font-weight: 600;
        border-radius: 10px;
        padding: 0.8rem 2.5rem;
        text-decoration: none;
        display: inline-block;
        margin-top: 1.5rem;
        font-size: 1.1rem;
        border: none;
    }
    .btn-login:hover {
        background: #2B8000;
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(57,169,0,0.3);
    }
</style>
</head>
<body>
<div class="complete-card">
    <div class="success-icon">
        <i class="bi bi-shield-fill-check"></i>
    </div>
    
    <h2>¡Contraseña Actualizada!</h2>
    
    <p class="text-muted mb-3">
        Tu contraseña ha sido cambiada exitosamente.
    </p>
    
    <div class="alert alert-success">
        <i class="bi bi-check-circle-fill me-2"></i>
        Ya puedes iniciar sesión con tu nueva contraseña.
    </div>

    <a href="{% url 'cuentas:login' %}" class="btn btn-login">
        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
    </a>
</div>

{% include 'accesibilidad_panel.html' %}

<script src="{% static 'js/accesibilidad.js' %}?v=2.1"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
