{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerrar Sesión - Sistema de Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/control.css' %}?v=1.3">
    <style>
        /* 🔹 Fondo degradado */
        body {
            background: linear-gradient(120deg, #39A900, #005DA8);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 🔹 Tarjeta */
        .logout-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            max-width: 420px;
            width: 100%;
            padding: 2rem;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .logout-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        /* 🔹 Icono */
        .logout-icon {
            font-size: 4rem;
            color: #005DA8;
            margin-bottom: 1rem;
        }

        /* 🔹 Título y texto */
        .logout-card h2 {
            color: #005DA8;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .logout-card p {
            color: #555;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        /* 🔹 Botones */
        .btn-logout {
            background: #39A900;
            color: white;
            font-weight: 600;
            border-radius: 10px;
            padding: 0.6rem 1.5rem;
            transition: background 0.3s, transform 0.2s;
        }
        .btn-logout:hover {
            background: #2B8000;
            transform: scale(1.05);
        }
        .btn-secondary {
            border-radius: 10px;
        }

        /* 🔹 Footer */
        .footer-text {
            font-size: 0.9rem;
            color: #444;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="logout-card">
        <div class="logout-icon">🔒</div>
        <h2>Sesión Cerrada</h2>
        <p>Has cerrado sesión correctamente. Gracias por usar el Sistema de Control.</p>

        <a href="{% url 'usuarios:login' %}" class="btn btn-logout w-100 mb-2">🔑 Iniciar Sesión nuevamente</a>
        <a href="/" class="btn btn-secondary w-100">🏠 Ir al inicio</a>

        <p class="footer-text mt-3">© 2025 Sistema de Control SENA</p>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
