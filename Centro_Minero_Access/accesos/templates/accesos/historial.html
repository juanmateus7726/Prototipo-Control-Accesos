{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial de Accesos</title>
    <link rel="stylesheet" href="{% static 'accesos/css/styles.css' %}">
</head>
<body>
    <h1>Historial de Accesos</h1>
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Usuario</th>
                <th>Tipo</th>
                <th>Laboratorio</th>
                <th>Fecha y Hora</th>
            </tr>
        </thead>
        <tbody>
            {% for acceso in accesos %}
            <tr>
                <td>{{ acceso.usuario }}</td>
                <td>{{ acceso.tipo }}</td>
                <td>{{ acceso.laboratorio }}</td>
                <td>{{ acceso.fecha_hora }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No hay accesos registrados.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br>
    <a href="{% url 'index' %}">⬅ Volver al inicio</a>
</body>
</html>
