<!-- 🔹 PANEL DE ACCESIBILIDAD -->

    <div id="accesibilidad-panel" class="position-fixed bottom-0 end-0 m-4 z-50">
        <button id="btnAccesibilidad" class="btn btn-success rounded-circle p-3 shadow" title="Opciones de accesibilidad">♿</button>

        <div id="menuAccesibilidad" class="card shadow-lg p-3" style="display:none; width: 280px;">
            <h6 class="text-center mb-3">Accesibilidad</h6>
            <button id="contraste" class="btn btn-outline-dark w-100 mb-2">🌗 Alto Contraste</button>
            <button id="aumentarTexto" class="btn btn-outline-primary w-100 mb-2">🔠 Aumentar Texto</button>
            <button id="disminuirTexto" class="btn btn-outline-secondary w-100 mb-2">🔡 Disminuir Texto</button>
            <button onclick="toggleLectura()" id="botonLectura" class="btn btn-outline-success w-100 mb-2"><i class="bi bi-play-circle"></i> Leer Página</button>
            <button id="cursorGrande" class="btn btn-outline-warning w-100 mb-2">🖱️ Cursor Grande</button>
            <button id="modoDislexia" class="btn btn-outline-info w-100 mb-2">📘 Fuente Dislexia</button>
            <button id="resetAccesibilidad" class="btn btn-outline-secondary w-100 mb-2">♻️ Restablecer Todo</button>
            <button id="cerrarAccesibilidad" class="btn btn-outline-danger w-100">Cerrar</button>
        </div>
    </div>
