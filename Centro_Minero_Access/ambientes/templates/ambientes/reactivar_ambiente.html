<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reactivar Ambiente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center text-success mb-4">Reactivar Ambiente</h1>

    <div class="card shadow p-4">
        <p class="lead text-center">
            ¿Estás seguro de que deseas reactivar el ambiente:
            <strong>{{ ambiente.nombre }}</strong>?
        </p>

        <form method="post" class="text-center mt-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-success px-4">Reactivar</button>
            <a href="{% url 'ambientes:listar_ambientes_deshabilitados' %}" class="btn btn-secondary px-4">
                Cancelar
            </a>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
