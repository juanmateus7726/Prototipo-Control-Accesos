{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala de Laboratorio - SENA Minero</title>
    <link href="https://cdn.tailwindcss.com" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center">

    <header class="w-full bg-gray-800 py-4 text-center text-xl font-bold">
        Sala de Laboratorio
    </header>

    <main class="mt-10 w-full max-w-2xl px-4">
        <div class="bg-gray-800 p-6 rounded-2xl shadow-lg text-center">
            <h2 class="text-xl font-semibold mb-4">Bienvenido al laboratorio</h2>
            <p class="mb-6">Escanea tu rostro para validar tu acceso.</p>

            <div class="mb-4">
                <!-- Aquí se puede integrar la cámara con JavaScript / WebRTC -->
                <video id="video" autoplay class="rounded-lg w-full max-w-md border-2 border-gray-600"></video>
            </div>

            <button id="btnVerificar" class="bg-blue-600 hover:bg-blue-700 py-3 px-6 rounded-lg font-semibold transition">
                Verificar Identidad
            </button>

            <p id="mensaje" class="mt-4 font-semibold"></p>
        </div>
    </main>

    <script>
        // Captura básica de cámara
        const video = document.getElementById('video');
        const mensaje = document.getElementById('mensaje');
        const btn = document.getElementById('btnVerificar');

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => video.srcObject = stream)
            .catch(err => mensaje.textContent = 'No se pudo acceder a la cámara');

        btn.addEventListener('click', () => {
            // Aquí se conectaría con tu backend / modelo de reconocimiento facial
            // Por ahora simulamos:
            const autorizado = Math.random() > 0.5; // Simulación
            mensaje.textContent = autorizado ? '✅ Bienvenido, acceso permitido' : '❌ Acceso denegado';
            mensaje.className = autorizado ? 'mt-4 font-semibold text-green-400' : 'mt-4 font-semibold text-red-500';
        });
    </script>

</body>
</html>
