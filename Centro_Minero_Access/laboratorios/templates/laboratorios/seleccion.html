{% extends "laboratorio/index.html" %}

{% block content %}
<div class="max-w-3xl mx-auto mt-10 p-6 bg-gray-800 rounded-xl shadow-lg text-white">
    <h1 class="text-2xl font-bold mb-6 text-center">Selecciona un Laboratorio</h1>
    
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <select name="laboratorio" class="w-full p-3 rounded bg-gray-700 text-white">
            <option value="" disabled selected>-- Escoge un laboratorio --</option>
            {% for lab in laboratorios %}
                <option value="{{ lab.id }}">{{ lab.nombre }}</option>
            {% endfor %}
        </select>

        <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white py-2 rounded font-semibold">
            Entrar
        </button>
    </form>
</div>
{% endblock %}
