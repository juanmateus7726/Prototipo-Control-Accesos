<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen text-white">
    <div class="bg-gray-800 p-8 rounded-lg shadow-md w-full max-w-sm">
        <h1 class="text-2xl font-bold mb-6 text-center">Iniciar sesión</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="bg-red-600 p-2 rounded">
                    Usuario o contraseña incorrectos
                </div>
            {% endif %}

            <input type="text" name="username" placeholder="Usuario" class="w-full p-2 rounded bg-gray-700 text-white" required>
            <input type="password" name="password" placeholder="Contraseña" class="w-full p-2 rounded bg-gray-700 text-white" required>
            <button type="submit" class="w-full bg-green-500 hover:bg-green-600 py-2 rounded font-semibold">Entrar</button>
        </form>

        <p class="mt-4 text-center text-gray-400 text-sm">
            ¿No tienes cuenta? Contacta al administrador.
        </p>
    </div>
</body>
</html>
