<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reactivar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center text-success mb-4">Reactivar Usuario</h1>

    <div class="card shadow p-4">
        <p class="lead text-center">
            ¿Estás seguro de que deseas reactivar el usuario: 
            <strong>{{ usuario.nombre }}</strong>?
        </p>

        <ul class="list-group mb-3">
            <li class="list-group-item"><strong>Tipo de Identificación:</strong> {{ usuario.get_tipo_identificacion_display }}</li>
            <li class="list-group-item"><strong>Número de Identificación:</strong> {{ usuario.numero_identificacion }}</li>
            <li class="list-group-item"><strong>Tipo:</strong> {{ usuario.get_tipo_display }}</li>
        </ul>

        <form method="post" class="text-center mt-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-success px-4">
                <i class="bi bi-person-check-fill"></i> Reactivar
            </button>
            <a href="{% url 'usuarios:listar_usuarios_deshabilitados' %}" class="btn btn-secondary px-4">
                Cancelar
            </a>
        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

</body>
</html>
