<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuarios</title>
</head>
<body>
    <h1>Lista de Usuarios</h1>
    <a href="{% url 'crear_usuario' %}">Crear Nuevo Usuario</a>
    <ul>
        {% for usuario in usuarios %}
            <li>
                {{ usuario.nombre }} ({{ usuario.carnet }}) - {{ usuario.tipo }}
                <a href="{% url 'editar_usuario' usuario.pk %}">Editar</a>
                <a href="{% url 'eliminar_usuario' usuario.pk %}">Eliminar</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
